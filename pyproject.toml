[project]
name = "iot-mud-server"
version = "2.1.8"
description = "The common club IoT MUD server: authoritative engine, protocol v2, WebSocket terminal."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "websockets>=12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# `src/` is a namespace package, so the repo root must be importable for
# `src.mud.*` regardless of how pytest is launched.
pythonpath = ["."]
markers = [
    "load: end-to-end 20-client load smoke (#86); the PR test job excludes it, the load-nightly workflow runs `uv run pytest -m load`",
]

[tool.ruff]
line-length = 88
