name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install
        run: uv sync --all-extras
      - name: Test
        # The load smoke runs nightly in load-nightly.yml; keep the PR gate
        # fast and deterministic (#86).
        run: uv run pytest -m "not load"
